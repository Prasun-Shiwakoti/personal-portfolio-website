<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prasun Shiwakoti</title>
<meta name="description" id="metaDesc" content="" />
<meta name="theme-color" content="#FBF9F5" />

<!-- set before first paint so reveal states never flash -->
<script>document.documentElement.className = "js";</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#masthead">Skip to content</a>

<!-- thin sticky topbar -->
<header class="topbar" id="topbar">
  <a href="#masthead" class="wordmark" id="wordmark"></a>
  <nav class="topnav" id="navLinks" aria-label="Sections"></nav>
  <button class="menubtn" id="menuToggle" aria-expanded="false" aria-controls="mmenu">Index</button>
</header>

<!-- mobile index sheet -->
<div class="sheet" id="mmenu" hidden>
  <button class="sheet-close" id="menuClose" aria-label="Close index">Close</button>
  <nav id="mmenuLinks" aria-label="Sections"></nav>
</div>

<main>

<!-- ─────────────── MASTHEAD ─────────────── -->
<section class="masthead" id="masthead">
  <div class="dateline" id="dateline"></div>
  <hr class="rule">
  <h1 class="mast-name" id="mastName"></h1>
  <hr class="rule rule-heavy">
  <div class="mast-body">
    <p class="lede dropcap" id="mastLede"></p>
    <div class="mast-aside">
      <p class="lede-sub" id="mastLedeSub"></p>
      <div class="mast-links" id="mastLinks"></div>
    </div>
  </div>
</section>

<!-- ─────────────── TICKER ─────────────── -->
<div class="ticker" aria-hidden="true">
  <div class="ticker-track" id="ticker"></div>
</div>

<!-- ─────────────── ABOUT ─────────────── -->
<section class="sec" id="about" data-name="About">
  <div class="sec-head" data-reveal>
    <span class="folio">02</span>
    <h2 class="sec-title">About</h2>
    <p class="sec-note" id="aboutNote"></p>
  </div>

  <div class="about-grid">
    <figure class="plate" data-reveal>
      <div class="plate-img">
        <img id="portrait" alt="" width="880" height="1100" loading="lazy" decoding="async"
             onerror="this.style.display='none';this.nextElementSibling.hidden=false;">
      </div>
      <figcaption id="plateCaption"></figcaption>
    </figure>
    <div class="about-copy">
      <p class="about-lead" id="aboutLead" data-reveal></p>
      <p class="about-sub" id="aboutSub" data-reveal></p>
    </div>
  </div>

  <!-- ledger strip -->
  <div class="ledger" id="ledger" data-reveal></div>
</section>

<!-- ─────────────── WORK ─────────────── -->
<section class="sec" id="work" data-name="Selected work">
  <div class="sec-head" data-reveal>
    <span class="folio">03</span>
    <h2 class="sec-title">Selected work</h2>
    <p class="sec-note">Six things worth showing. Source for all of them is on GitHub.</p>
  </div>
  <ol class="index" id="workIndex"></ol>
</section>

<!-- ─────────────── EXPERIENCE ─────────────── -->
<section class="sec" id="experience" data-name="Experience">
  <div class="sec-head" data-reveal>
    <span class="folio">04</span>
    <h2 class="sec-title">Experience</h2>
    <p class="sec-note">Where the shipping has actually happened.</p>
  </div>
  <div class="entries" id="entries"></div>
</section>

<!-- ─────────────── BACKGROUND ─────────────── -->
<section class="sec" id="background" data-name="Background">
  <div class="sec-head" data-reveal>
    <span class="folio">05</span>
    <h2 class="sec-title">Background</h2>
    <p class="sec-note">Education, earlier highlights, and the paperwork.</p>
  </div>

  <div class="bg-grid">
    <div class="bg-col" id="eduBlock" data-reveal></div>
    <div class="bg-col" id="hlBlock" data-reveal></div>
  </div>

  <h3 class="sub-label" data-reveal>Certifications</h3>
  <ul class="certs" id="certs"></ul>
</section>

<!-- ─────────────── CONTACT ─────────────── -->
<section class="sec sec-contact" id="contact" data-name="Contact">
  <!-- no section head here: the headline is the heading. Just the sheet rule,
       so the section still opens on the same line every other one does. -->
  <hr class="rule rule-heavy contact-rule" data-reveal>
  <h2 class="contact-head" id="contactHead" data-reveal></h2>
  <p class="contact-note" id="contactNote" data-reveal></p>
  <ul class="contact-list" id="contactList"></ul>
</section>

</main>

<footer class="colophon">
  <hr class="rule">
  <div class="colophon-grid">
    <span id="footCopy"></span>
    <span id="footLoc"></span>
    <span id="footNote"></span>
  </div>
</footer>

<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
